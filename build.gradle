// Root project — multi-module Gradle build
// Core logic: core/ (pure Java, Spring Boot + LangChain4j)
// Fabric mod wrapper: fabric-mod/ (Fabric Loom, depends on core)

allprojects {
    version = '0.2.0-SNAPSHOT'
    group = 'com.mcagent'

    repositories {
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
    }
}
