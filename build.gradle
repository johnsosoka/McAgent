plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.6'
}

version = '0.1.0-SNAPSHOT'
group = 'com.mcagent'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Fix for UnionFileSystem multi-release JAR scanning crash on macOS
            jvmArgs '-Djdk.util.jar.enableMultiRelease=false'
            // API key for LLM service — read from environment or .env file
            environment 'FIREWORKS_API_KEY', System.getenv('FIREWORKS_API_KEY') ?: ''
            mods {
                mc_agent {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.minecraftforge.net/' }
    flatDir {
        dirs '.local-deps'
    }
}

dependencies {
    // --- Forge / Minecraft ---
    minecraft 'net.minecraftforge:forge:1.20.1-47.1.0'

    // Baritone API (Forge-mapped, compile-only — runtime provided by baritone-standalone-forge mod)
    compileOnly name: 'baritone-api-forge-1.10.1'

    // --- Spring Boot (core business logic) ---
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.0')
    implementation('org.springframework.boot:spring-boot-starter') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    implementation('org.springframework.boot:spring-boot-starter-data-jpa') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    implementation 'org.springframework.boot:spring-boot-configuration-processor'

    // --- LangChain4j ---
    implementation platform('dev.langchain4j:langchain4j-bom:1.15.0')
    implementation 'dev.langchain4j:langchain4j'
    implementation 'dev.langchain4j:langchain4j-open-ai'
    implementation 'dev.langchain4j:langchain4j-chroma'

    // --- Database ---
    runtimeOnly 'com.h2database:h2:2.2.224'
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    // --- Utilities ---
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // --- Testing ---
    testImplementation('org.springframework.boot:spring-boot-starter-test:3.4.0') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'McAgent',
            'Specification-Vendor': 'McAgent Team',
            'Specification-Version': '1',
            'Implementation-Title': 'McAgent',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'McAgent Team',
            'Implementation-Timestamp': new Date().format('yyyy-MM-dd\'T\'HH:mm:ssZ'),
            'FMLModType': 'GAMELIBRARY'
        ])
    }
}

shadowJar {
    archiveClassifier.set('all')
    zip64 = true
    // Preserve mods.toml and manifest
    mergeServiceFiles()
    manifest {
        inheritFrom jar.manifest
    }

    // Exclude Forge-provided and Minecraft classes from shading
    exclude 'net/minecraftforge/**'
    exclude 'net/minecraft/**'
    exclude 'cpw/mods/**'
    exclude 'org/slf4j/**'
    exclude 'org/apache/logging/**'

    // Relocate shaded dependencies to avoid classloader conflicts with other mods
    relocate 'org.springframework', 'com.mcagent.shaded.org.springframework'
    relocate 'dev.langchain4j', 'com.mcagent.shaded.dev.langchain4j'
    relocate 'com.fasterxml.jackson', 'com.mcagent.shaded.com.fasterxml.jackson'
    relocate 'com.google.gson', 'com.mcagent.shaded.com.google.gson'
    relocate 'org.hibernate', 'com.mcagent.shaded.org.hibernate'
    relocate 'org.yaml', 'com.mcagent.shaded.org.yaml'
    relocate 'com.zaxxer', 'com.mcagent.shaded.com.zaxxer'
    relocate 'org.aspectj', 'com.mcagent.shaded.org.aspectj'
    relocate 'io.micrometer', 'com.mcagent.shaded.io.micrometer'
    relocate 'jakarta', 'com.mcagent.shaded.jakarta'
    relocate 'org.jboss', 'com.mcagent.shaded.org.jboss'
    relocate 'com.google.common', 'com.mcagent.shaded.com.google.common'
    relocate 'org.apache.httpcomponents', 'com.mcagent.shaded.org.apache.httpcomponents'
    relocate 'io.netty', 'com.mcagent.shaded.io.netty'
    relocate 'org.antlr', 'com.mcagent.shaded.org.antlr'
    relocate 'org.opennlp', 'com.mcagent.shaded.org.opennlp'
    relocate 'com.github.oshi', 'com.mcagent.shaded.com.github.oshi'
    relocate 'com.machinezoo', 'com.mcagent.shaded.com.machinezoo'
    relocate 'com.knuddels', 'com.mcagent.shaded.com.knuddels'
    relocate 'com.ibm.icu', 'com.mcagent.shaded.com.ibm.icu'
    relocate 'org.glassfish', 'com.mcagent.shaded.org.glassfish'
    relocate 'org.eclipse', 'com.mcagent.shaded.org.eclipse'
    relocate 'com.sun', 'com.mcagent.shaded.com.sun'
}

// Configure ForgeGradle to reobfuscate the shadow JAR
reobf {
    shadowJar {
        // Use the same mappings and settings as the regular jar
    }
}

// Shadow JAR replaces the standard jarJar distribution
// jarJar is left enabled for any transitive mod dependencies

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
