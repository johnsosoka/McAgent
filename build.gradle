plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'maven-publish'
}

version = '0.1.0-SNAPSHOT'
group = 'com.mcagent'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                mc_agent {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.minecraftforge.net/' }
    flatDir {
        dirs '.local-deps'
    }
}

dependencies {
    // --- Forge / Minecraft ---
    minecraft 'net.minecraftforge:forge:1.20.1-47.1.0'

    // Baritone API (Forge-mapped, compile-only — runtime provided by baritone-standalone-forge mod)
    compileOnly name: 'baritone-api-forge-1.10.1'

    // --- Spring Boot (core business logic) ---
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.0')
    implementation('org.springframework.boot:spring-boot-starter') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    implementation('org.springframework.boot:spring-boot-starter-data-jpa') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    implementation 'org.springframework.boot:spring-boot-configuration-processor'

    // --- LangChain4j ---
    implementation platform('dev.langchain4j:langchain4j-bom:1.15.0')
    implementation 'dev.langchain4j:langchain4j'
    implementation 'dev.langchain4j:langchain4j-open-ai'
    implementation 'dev.langchain4j:langchain4j-chroma'

    // --- Database ---
    runtimeOnly 'com.h2database:h2:2.2.224'
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    // --- Utilities ---
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // --- Testing ---
    testImplementation('org.springframework.boot:spring-boot-starter-test:3.4.0') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'McAgent',
            'Specification-Vendor': 'McAgent Team',
            'Specification-Version': '1',
            'Implementation-Title': 'McAgent',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'McAgent Team',
            'Implementation-Timestamp': new Date().format('yyyy-MM-dd\'T\'HH:mm:ssZ'),
            'FMLModType': 'GAMELIBRARY'
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
