plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

version = '0.2.0-SNAPSHOT'
group = 'com.mcagent'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    // Spring Boot (headless, no web)
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.0')
    implementation('org.springframework.boot:spring-boot-starter') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    implementation('org.springframework.boot:spring-boot-starter-data-jpa') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    implementation 'org.springframework.boot:spring-boot-configuration-processor'

    // LangChain4j
    implementation platform('dev.langchain4j:langchain4j-bom:1.15.0')
    implementation 'dev.langchain4j:langchain4j'
    implementation 'dev.langchain4j:langchain4j-open-ai'
    implementation 'dev.langchain4j:langchain4j-chroma'

    // Database
    runtimeOnly 'com.h2database:h2:2.3.232'
    runtimeOnly 'org.postgresql:postgresql:42.7.4'

    // .env file loading
    implementation 'io.github.cdimascio:java-dotenv:5.2.2'

    // Utilities
    implementation 'com.google.guava:guava:33.5.0-jre'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

    // Testing
    testImplementation('org.springframework.boot:spring-boot-starter-test:3.4.0') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    testImplementation 'org.assertj:assertj-core:3.27.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'McAgent Core',
            'Specification-Vendor': 'McAgent Team',
            'Specification-Version': '1',
            'Implementation-Title': 'McAgent Core',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'McAgent Team',
            'Implementation-Timestamp': new Date().format('yyyy-MM-dd\'T\'HH:mm:ssZ')
        ])
    }
}
